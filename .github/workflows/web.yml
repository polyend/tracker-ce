name: Website

# Builds the site in web/ and deploys it to GitHub Pages, so the homepage always lists the newest
# release and the docs match docs/.
# - push to main: deploy changes to the site or the docs it renders.
# - workflow_run: redeploy after a firmware build on main or a tag, because releases published
#   with GITHUB_TOKEN don't fire `release` events. Builds of pull requests are skipped.
# - release: for releases published by hand.
# - pull_request: build only, so reviewers see the site compiles. Nothing is deployed.
# workflow_run and release only fire once this file is on the default branch.
on:
  push:
    branches: [ main ]
    paths: [ 'web/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/web.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'web/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/web.yml' ]
  workflow_run:
    workflows: [ 'Build Tracker CE Firmware' ]
    types: [ completed ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a pull request's builds only replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pages hands the build its site URL and base path. A pull request isn't deployed, so it
      # builds with the project-site path instead and doesn't need Pages to be set up.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
